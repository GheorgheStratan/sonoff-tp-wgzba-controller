# Builds the Windows installer and publishes it as a GitHub Release
# every time a version tag (for example v1.0.1) is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the release and upload the installer

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the installer
        # --publish never: electron-builder only builds, the next step publishes
        run: npm run dist -- --publish never

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
