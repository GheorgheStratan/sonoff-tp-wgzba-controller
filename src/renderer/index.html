<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sonoff Thermostat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <picture><source srcset="icon.png" media="(prefers-reduced-motion: reduce)"><img src="logo-animated.png" class="brand-icon" alt="" aria-hidden="true"></picture>
        <span data-i18n="appName"></span>
      </div>
      <nav class="nav" id="nav">
        <button data-page="home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-i18n="nav.home"></span></button>
        <button data-page="schedule"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-i18n="nav.schedule"></span></button>
        <button data-page="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span data-i18n="nav.settings"></span></button>
        <button data-page="history"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 4-6"/></svg><span data-i18n="nav.history"></span></button>
        <button data-page="network"><svg viewBox="0 0 24 24"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/></svg><span data-i18n="nav.network"></span></button>
        <button data-page="log"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/></svg><span data-i18n="nav.log"></span></button>
      </nav>
      <div class="sidebar-foot">
        <div class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText"></span></div>
        <div class="lang" role="group" aria-label="Language">
          <button data-lang="it">IT</button><button data-lang="en">EN</button>
        </div>
      </div>
    </aside>

    <main class="content">
      <section class="page" id="page-home"></section>
      <section class="page" id="page-schedule"></section>
      <section class="page" id="page-settings"></section>
      <section class="page" id="page-history"></section>
      <section class="page" id="page-network"></section>
      <section class="page" id="page-log"></section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
